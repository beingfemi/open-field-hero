<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Field Hero</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8D%88</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --ink-soft: #4d4d4d;
    --accent: #20fe06;
    --accent-ink: #000000;
    --font-display: "ABC Favorit", "Archivo", ui-sans-serif, system-ui, sans-serif;
  }

  /* The hero itself always stays pure black (matching the reference exactly,
     regardless of theme) — only the page ground around/outside it follows the
     viewer's system light/dark setting. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --ink: #ffffff;
      --ink-soft: #a8a8a8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --ink: #ffffff;
    --ink-soft: #a8a8a8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    font-family: var(--font-display);
    font-size: 12px;
    line-height: 15px;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  a { color: inherit; }

  .wrap { position: relative; }

  /* cursor trail: scoped to the hero only, matching the reference exactly —
     pointermove-driven, positions snap instantly (no lag), and the reveal is a
     scale pop-in (power3.out) followed by a fade-out (power2.in). */
  #trailLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .trail-img {
    position: absolute;
    left: 0;
    top: 0;
    width: clamp(7rem, 12vw, 12rem);
    aspect-ratio: 4 / 5;
    object-fit: cover;
    opacity: 0;
    pointer-events: none;
  }

  /* nav */
  header.top {
    padding: 1.1rem clamp(1rem, 2.4vw, 1.75rem) 0;
  }

  .wordmark {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: start;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 0.92;
    font-size: clamp(1.7rem, 5.3vw, 3.6rem);
  }
  .wordmark span:nth-child(1) { text-align: left; }
  .wordmark span:nth-child(2) { text-align: center; }
  .wordmark span:nth-child(3) { text-align: right; }

  nav.links {
    margin-top: 0.4rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.5rem 1.2rem;
    font-size: 0.8rem;
    letter-spacing: -0.014em;
  }
  nav.links a {
    text-decoration: none;
    position: relative;
    padding-bottom: 0.15rem;
  }
  nav.links a::after {
    content: "";
    position: absolute;
    left: 0; right: 100%;
    bottom: 0;
    height: 1px;
    background: var(--ink);
    transition: right 0.25s ease;
  }
  nav.links a:hover::after,
  nav.links a:focus-visible::after { right: 0; }
  nav.links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* hero */
  .hero {
    /* Full viewport height at every screen size. The reference uses 80svh on
       mobile because it has more sections below the hero to fill the rest —
       this page doesn't, so a partial height would just expose the page
       background under it (invisible in dark mode, a jarring white bar in
       light mode). Full height sidesteps that entirely. */
    position: relative;
    width: 100%;
    background: #000;
    height: 100svh;
    overflow: hidden;
  }


  .tagline-wrap {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 1.5rem;
    padding: 0 1rem;
  }

  .tagline {
    /* WIDTH: how wide the text block is before it wraps to a new line.
       1rem = 16px, so 58rem = 928px. Bigger number = longer lines. */
    max-width: 58rem;
    margin: 0;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 37px;
    font-size: 38px;
    color: #fff;
  }

  .tagline mark {
    background: linear-gradient(var(--accent), var(--accent));
    background-repeat: no-repeat;
    background-size: 100% 80%;
    background-position: center;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    color: var(--accent-ink);
    padding: 0 0.15em;
  }

  .cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.35em;
    font-size: 12px;
    line-height: 15px;
    letter-spacing: -0.014em;
    text-decoration: none;
    color: #fff;
    padding: 0.15em 0;
  }
  .cta::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0.05em;
    width: 100%;
    height: 1px;
    background: #fff;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
  }
  .cta:hover::after,
  .cta:focus-visible::after { transform: scaleX(1); }
  .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .cta::after, nav.links a::after { transition: none; }
  }

  @media (max-width: 640px) {
    .wordmark { grid-template-columns: 1fr; text-align: left; gap: 0.05rem; }
    .wordmark span:nth-child(2),
    .wordmark span:nth-child(3) { text-align: left; }
  }
</style>
</head>
<body>


<div class="hero" id="hero">
  <div id="trailLayer"></div>
  <div class="tagline-wrap">
    <p class="tagline"><mark>Garden Studio is a design agency for small labels, and independent projects.</mark></p>
    <a class="cta" href="#">See how it works ↗</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  (function () {
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var layer = document.getElementById('trailLayer');
    if (reduced) return;

    // Trail images are real files under images/trail/, not baked in — drop images in or
    // out of that folder (Finder/Cursor) and the manifest gets regenerated by
    // _scripts/pre-commit.sh on the next auto-commit. Fetched here at runtime so this
    // works with whatever's in the folder at deploy time, no code changes needed.
    fetch('images/trail/manifest.json')
      .then(function (r) { return r.json(); })
      .then(function (files) {
        var images = files.map(function (f) { return 'images/trail/' + f; });
        if (images.length) initTrail(images);
      })
      .catch(function () {
        // no manifest yet (fresh project, or images/trail/ is empty) — trail just stays off
      });

    function initTrail(TRAIL_IMAGES) {
      // Cursor trail — this now runs on the real GSAP library (loaded via CDN above),
      // calling it exactly the way the reference's own bundle does, instead of
      // approximating power3.out/power2.in with a CSS cubic-bezier. A single
      // cubic-bezier can't actually reproduce GSAP's power eases (they're a different
      // curve family), and the old forced-reflow "snap" trick could jank under fast
      // mouse movement — using GSAP directly fixes both, and matches the reference's
      // pool-of-18 / 90px-throttle / instant-snap-on-first-move behavior exactly.
      var POOL_SIZE = 18;
      var MIN_DIST = 90;

      var pool = [];
      for (var i = 0; i < POOL_SIZE; i++) {
        var img = document.createElement('img');
        img.className = 'trail-img';
        img.alt = '';
        layer.appendChild(img);
        gsap.set(img, { xPercent: -50, yPercent: -50 });
        pool.push(img);
      }

      var poolIdx = 0, imgIdx = 0, z = 0, started = false, lastX = 0, lastY = 0;

      function spawn(x, y) {
        var img = pool[poolIdx];
        poolIdx = (poolIdx + 1) % POOL_SIZE;
        img.src = TRAIL_IMAGES[imgIdx];
        imgIdx = (imgIdx + 1) % TRAIL_IMAGES.length;

        gsap.killTweensOf(img);
        gsap.set(img, { x: x, y: y, scale: 0.82, opacity: 1, zIndex: ++z });
        gsap.timeline()
          .to(img, { scale: 1, duration: 0.35, ease: 'power3.out' }, 0)
          .to(img, { opacity: 0, duration: 0.5, ease: 'power2.in' }, 0.35);
      }

      document.getElementById('hero').addEventListener('pointermove', function (e) {
        var r = this.getBoundingClientRect();
        var x = e.clientX - r.left, y = e.clientY - r.top;
        if (!started) { started = true; lastX = x; lastY = y; spawn(x, y); return; }
        var dx = x - lastX, dy = y - lastY;
        if (dx * dx + dy * dy < MIN_DIST * MIN_DIST) return;
        lastX = x; lastY = y;
        spawn(x, y);
      });
    }
  })();
</script>
</body>
</html>
